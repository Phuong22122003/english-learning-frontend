# Define the user that Nginx worker processes will run under
user nginx;

# Set the number of worker processes
worker_processes 1;

# Specify the location of the error log file and log level
error_log /var/log/nginx/error.log warn;

# Specify the location of the PID file that stores the process ID of the main process
pid /var/run/nginx.pid;

# Events block to configure connection handling
events {
    # Maximum number of concurrent connections a worker process can open
    worker_connections 1024;
}

# HTTP block to define HTTP server settings
http {
    # Include MIME type definitions
    include /etc/nginx/mime.types;

    # Set the default MIME type for files
    default_type application/octet-stream;

    # Define log format for access logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    # Specify the location and format of access logs
    access_log /var/log/nginx/access.log main;

    # Enable sendfile to improve performance by reducing context switches between kernel and user space
    sendfile on;

    # Set the timeout for keep-alive connections with clients
    keepalive_timeout 65;

    # Server block to define server settings
    server {
        # Listen on port 80 (HTTP)
        listen 80;

        # Define the server name
        server_name webclient;

        # Location block to define how to handle requests to the root address
        location / {
            # Define the root directory for requests
            root /run;

            # Specify the index file to serve when a directory is requested
            index index.html;

            # Try to serve the file, if not found redirect to /index.html
            try_files $uri $uri/ /index.html;
        }

        # Define custom error pages for specific HTTP status codes
        error_page 500 502 503 504 /50x.html;

        # Location block to serve custom error pages
        location = /50x.html {
            # Define the root directory for error pages
            root /usr/share/nginx/html;
        }
    }
}
