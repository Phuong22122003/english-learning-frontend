<aside
  class="bg-[#0f172a] border-r border-slate-700/50 h-full transition-all duration-300 relative shadow-xl flex flex-col"
  [class.w-20]="isCollapsed"
  [class.w-64]="!isCollapsed"
>
  <div class="p-5 flex items-center" [class.justify-center]="isCollapsed">
    <button
      (click)="toggleCollapse()"
      class="p-2 text-slate-300 hover:bg-slate-700/50 rounded-full transition-all duration-200 focus:outline-none hover:scale-110"
      title="Menu"
      type="button"
    >
      <fa-icon [icon]="faBars" class="text-xl"></fa-icon>
    </button>
    <span *ngIf="!isCollapsed" class="ml-4 font-black text-white tracking-widest uppercase text-[10px] opacity-70">
      Dashboard
    </span>
  </div>

  <nav class="flex-1 overflow-y-auto overflow-x-hidden px-3 custom-scrollbar">
    <div *ngFor="let group of sidebarItems; let last = last" class="py-2">
      <div *ngIf="group.visible">
        <div *ngIf="!isCollapsed && group.label && !group.href" class="px-4 py-2 text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">
          {{ group.label }}
        </div>
  
        <div class="space-y-1">
          <a *ngIf="group.href"
             [routerLink]="group.href"
             routerLinkActive="text-sky-400 bg-gray-800 text-white font-bold"
             class="flex items-center py-3 px-4 text-sm rounded-xl transition-all duration-200 group text-slate-300 hover:bg-slate-800"
             [ngClass]="{'justify-center px-0': isCollapsed}">
            <fa-icon [icon]="group.icon" class="text-lg" [class.mr-4]="!isCollapsed"></fa-icon>
            <span *ngIf="!isCollapsed" class="whitespace-nowrap">{{ group.label }}</span>
          </a>
  
          <ng-container *ngIf="group.children">
            <a *ngFor="let child of group.children"
               [routerLink]="child.href"
               routerLinkActive="text-sky-400 bg-gray-800 text-white font-bold"
               class="flex items-center py-3 px-4 text-sm rounded-xl transition-all duration-200 group text-slate-300 hover:bg-slate-800"
               [ngClass]="{'justify-center px-0': isCollapsed}">
              <fa-icon [icon]="child.icon" class="text-lg" [class.mr-4]="!isCollapsed"></fa-icon>
              <span *ngIf="!isCollapsed" class="whitespace-nowrap">{{ child.label }}</span>
            </a>
          </ng-container>
        </div>
  
        <div *ngIf="!last" class="mx-4 my-4 border-t border-slate-700/50"></div>
      </div>
    </div>
  </nav>

  <div *ngIf="!isCollapsed" class="p-6 text-[9px] text-slate-600 font-medium">
    © 2026 User Panel
  </div>
</aside>
