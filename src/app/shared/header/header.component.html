<header class="bg-white border-b border-gray-200 dark:bg-gray-900 dark:border-gray-700 sticky top-0 z-50">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16 gap-4">
      
      <div class="flex-shrink-0">
        <a routerLink="/" class="flex items-center gap-2">
          <img src="assets/images/logo1.png" alt="Logo" class="h-8 w-8" />
          <span class="hidden md:block font-bold text-xl text-gray-800 dark:text-gray-100">English Learning</span>
        </a>
      </div>

      <div class="flex-1 max-w-lg mx-auto">
        <div class="relative flex items-center">
          <div class="relative flex-1">
            <input
              type="text"
              [(ngModel)]="searchQuery"
              name="searchQuery"
              (keydown)="onSearchKeyPress($event)"
              placeholder="Search..."
              class="w-full rounded-full border border-gray-300 bg-gray-50 pl-10 pr-24 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-200"
            />
            <fa-icon
              [icon]="faSearch"
              (click)="onSearch()"
              class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-blue-500 transition-colors"
            ></fa-icon>
            
            <div class="absolute right-3 top-1/2 -translate-y-1/2 border-l pl-2 border-gray-300 dark:border-gray-600">
              <select
                [(ngModel)]="selectedTopicType"
                name="topicType"
                title="Choose search type"
                aria-label="Choose search type"
                class="bg-transparent border-none outline-none text-gray-400 text-xs cursor-pointer"
              >
                <option *ngFor="let type of topicTypes" [value]="type.value">
                  {{ type.label }}
                </option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-10">
        <a routerLink="/full-test/groups" 
           class="text-sm font-semibold text-gray-600 dark:text-gray-300 hover:text-blue-600 transition-colors hidden md:block">
           TOEIC Tests
        </a>

        <div *ngIf="isLoggedIn" class="relative" #dropdownContainer>
          <button
            (click)="toggleDropdown($event)"
            class="h-8 w-8 rounded-full overflow-hidden ring-2 ring-transparent hover:ring-blue-400 focus:outline-none flex items-center justify-center"
          >
            <img
              [src]="avatarUrl ? avatarUrl : 'assets/images/placeholder.png'"
              alt="User avatar"
              class="h-8 w-8 object-cover"
            />
          </button>

          <div
            *ngIf="isDropdownOpen"
            class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-md shadow-lg py-1 z-20"
          >
            <a
              [routerLink]="['/profile']"
              (click)="isDropdownOpen = false"
              class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer"
            >
              <fa-icon [icon]="faUser" class="mr-2"></fa-icon>
              Personal Profile
            </a>
            <div class="border-t border-gray-200 dark:border-gray-700"></div>
            <a
              *ngIf="isAdmin()"
              [routerLink]="['/admin']"
              (click)="isDropdownOpen = false"
              class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer"
            >
              <fa-icon [icon]="faUserGraduate" class="mr-2"></fa-icon>
              Admin
            </a>
            <button
              (click)="handleLogout(); isDropdownOpen = false"
              class="w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30"
            >
              <fa-icon [icon]="faSignOutAlt" class="mr-2"></fa-icon>
              Logout
            </button>
          </div>
        </div>
        <div *ngIf="!isLoggedIn">
          <a
            routerLink="/login"
            class="text-white"
          > 
            Login
          </a>
        </div>
      </div>

    </div>
  </div>
</header>
