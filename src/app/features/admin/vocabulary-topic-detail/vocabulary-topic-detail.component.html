<div class="space-y-6 py-8 px-4">
  <div class="w-full">
    <div *ngIf="currentState === State.View">
      <div class="mb-2 text-3xl font-bold">Vocabulary List</div>
      <div class="mb-8 text-xl font-medium">Topic: {{ name }}</div>
      <div class="flex justify-end mb-4 gap-3">
        <button
          (click)="changeToUpload()"
          class="w-fit inline-flex items-center justify-center gap-2 rounded-md px-4 py-2 border border-primary text-primary text-primary-foreground bg-primary hover:opacity-90"
        >
          <fa-icon [icon]="faUpload"></fa-icon>
          Upload Vocabulary
        </button>
        <button
          (click)="changeToCreate()"
          class="w-fit inline-flex items-center justify-center gap-2 rounded-md px-4 py-2 border border-primary text-primary text-primary-foreground bg-navy-header hover:opacity-90"
        >
          Add New Vocabulary
        </button>
      </div>
      <div *ngFor="let vocab of vocabList">
        <div class="mb-4">
          <app-admin-vocab-item
            [vocab]="vocab"
            (edit)="changeToEdit($event)"
            (delete)="handleDelete($event)"
          ></app-admin-vocab-item>
        </div>
      </div>
    </div>

    <div *ngIf="currentState === State.Edit && vocabToEdit">
      <div class="mb-8 text-3xl font-bold">Edit Vocabulary</div>
      <app-vocab-edit
        [vocab]="vocabToEdit"
        (save)="handleEdit($event)"
        (cancel)="handleCancel()"
      ></app-vocab-edit>
    </div>

    <div *ngIf="currentState === State.Create">
      <div class="mb-8 text-3xl font-bold">Add New Vocabulary</div>
      <app-vocab-edit
        (save)="handleCreate($event)"
        (cancel)="handleCancel()"
      ></app-vocab-edit>
    </div>

    <div *ngIf="currentState === State.Upload">
      <app-upload-by-file
        [title]="'Upload Vocabulary'"
        [description]="'Upload vocabulary to update data'"
        [isContainsImage]="true"
        [isContainsAudio]="true"
        [excelTemplate]="excelTemplate"
        (uploadFile)="handleUpload($event)"
      ></app-upload-by-file>
    </div>
  </div>
</div>
<app-confirm-dialog
  [isVisible]="isShowConfirmDialog"
  title="Delete Vocabulary"
  message="Are you sure you want to delete this vocabulary? This action cannot be undone."
  confirmText="Delete"
  cancelText="Cancel"
  confirmButtonClass="form-button-danger"
  cancelButtonClass="form-button-secondary"
  (confirm)="handleConfirmDelete()"
  (cancel)="handleCancelDelete()"
></app-confirm-dialog>
