<div class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">
      {{
        selectedTopic
          ? "Quản lý bài test - " + selectedTopic.name
          : "Quản lý bài test nghe"
      }}
    </h1>
    <div class="flex gap-3">
      <button
        *ngIf="selectedTopic && currentState === State.View"
        (click)="changeToUpload()"
        class="bg-navy-header text-white px-4 py-2 rounded-lg hover:opacity-80"
      >
        Tải lên bài test bằng file
      </button>
      <button
        *ngIf="selectedTopic && currentState === State.View"
        (click)="onCreateTest()"
        class="bg-primary text-white px-4 py-2 rounded-lg hover:opacity-80"
      >
        Tạo bài test mới
      </button>
      <app-ai-button
        *ngIf="selectedTopic && currentState === State.View"
        (click)="isShowGenerateTests = true"
        class="hidden"
        >Generate Test</app-ai-button
      >
      <button
        *ngIf="selectedTopic"
        (click)="goBackToTopics()"
        class="bg-navy-header text-white px-4 py-2 rounded-lg hover:opacity-80"
      >
        Quay lại danh sách chủ đề
      </button>
    </div>
  </div>

  <!-- Topic Selection View -->
  <div
    *ngIf="!selectedTopic && currentState === State.View"
    class="view-transition"
  >
    <div class="mb-6">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">
        Chọn chủ đề để quản lý bài test
      </h2>
      <p class="text-gray-600">
        Vui lòng chọn một chủ đề nghe để xem và quản lý các bài test.
      </p>
    </div>

    <!-- Topics Grid -->
    <app-topic-test-card-grid
      [topics]="topicsBase"
      (topicSelect)="onTopicSelect($event)"
    ></app-topic-test-card-grid>

    <!-- Empty State -->
    <div *ngIf="topics.length === 0" class="text-center py-12">
      <div class="text-gray-400 text-6xl mb-4">🎧</div>
      <h3 class="text-xl font-semibold text-gray-600 mb-2">
        Chưa có chủ đề nào
      </h3>
      <p class="text-gray-500">
        Hãy tạo chủ đề nghe trước khi quản lý bài test.
      </p>
    </div>
  </div>

  <!-- Tests Management View -->
  <div
    *ngIf="selectedTopic && currentState === State.View"
    class="view-transition"
  >
    <!-- Tests List -->
    <app-test-list
      [tests]="testsBase"
      (viewTest)="onViewTest($event)"
      (editTest)="onEditTest($event)"
      (deleteTest)="onDeleteTest($event)"
      [selectedTopicName]="selectedTopic.name || ''"
      (createTest)="onCreateTest()"
      (pageChange)="onPageChange($event)"
      [currentPage]="currentPage"
      [totalPages]="totalPages"
    ></app-test-list>
  </div>

  <!-- Create Test Form -->
  <div *ngIf="currentState === State.Create" class="view-transition">
    <app-test-form
      [config]="listeningTestConfig"
      [isEditMode]="false"
      (save)="onSaveTest($event)"
      (cancel)="onCancelCreate()"
    ></app-test-form>
  </div>

  <!-- Edit Test Form -->
  <div *ngIf="currentState === State.Edit" class="view-transition">
    <app-test-form
      [config]="listeningTestConfig"
      [isEditMode]="true"
      [editData]="editTestData || undefined"
      (save)="onUpdateTest($event)"
      (cancel)="onCancelEdit()"
    ></app-test-form>
  </div>

  <!-- Upload Test Form -->
  <div *ngIf="currentState === State.Upload" class="view-transition">
    <app-upload-by-file
      (uploadFile)="onUploadTest($event)"
      [title]="'Tải lên bài test'"
      [description]="'Tải lên bài test để tạo mới'"
      [isContainsImage]="true"
      [isContainsAudio]="true"
      [excelTemplate]="excelTemplate"
    ></app-upload-by-file>
  </div>

  <!-- Confirm Delete Dialog -->
  <app-confirm-dialog
    [isVisible]="showDeleteConfirm"
    title="Xóa bài test nghe"
    [message]="
      'Bạn có chắc chắn muốn xóa bài test \'' +
      (idToDelete || '') +
      '\'? Hành động này không thể hoàn tác.'
    "
    confirmText="Xóa"
    cancelText="Hủy"
    confirmButtonClass="form-button-danger"
    cancelButtonClass="form-button-secondary"
    (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()"
  ></app-confirm-dialog>

  <app-generate-tests
    [topicType]="'Listening'"
    (closed)="isShowGenerateTests = false"
    (submitted)="submitGenerateTests($event)"
    [isOpen]="isShowGenerateTests"
    [topicLevel]="selectedTopic?.level?.toString() || ''"
  ></app-generate-tests>
</div>
