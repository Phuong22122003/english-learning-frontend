<aside
  class="bg-white border-r border-gray-200 h-full transition-all duration-300 relative shadow-sm flex flex-col"
  [class.w-20]="isCollapsed"
  [class.w-64]="!isCollapsed"
>
  <div class="p-5 flex items-center" [class.justify-center]="isCollapsed">
    <button
      (click)="toggleCollapse()"
      class="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-all duration-200 focus:outline-none hover:scale-110"
      title="Menu"
      type="button"
    >
      <fa-icon [icon]="faBars" class="text-xl"></fa-icon>
    </button>
    <span *ngIf="!isCollapsed" class="ml-4 font-black text-gray-800 tracking-widest uppercase text-[10px] opacity-80">
      Dashboard
    </span>
  </div>

  <nav class="flex-1 overflow-y-auto overflow-x-hidden px-3 custom-scrollbar">
    <div *ngFor="let group of sidebarItems; let last = last" class="py-2">
      
      <div *ngIf="!isCollapsed && group.label && !group.href" 
           class="px-4 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em]">
        {{ group.label }}
      </div>

      <div class="space-y-1">
        <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: group }"></ng-container>
        
        <ng-container *ngIf="group.children">
          <div *ngFor="let child of group.children">
             <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: child }"></ng-container>
          </div>
        </ng-container>
      </div>

      <div *ngIf="!last" class="mx-4 my-4 border-t border-gray-100"></div>
    </div>
  </nav>

  <ng-template #itemTemplate let-item>
    <a *ngIf="item.href"
       [routerLink]="item.href"
       routerLinkActive="text-blue-600 font-semibold bg-gray-200"
       class="flex items-center py-3 px-4 text-sm rounded-xl transition-all duration-200 group text-gray-600 hover:bg-gray-50 hover:text-gray-900"
       [ngClass]="{'justify-center px-0': isCollapsed}">
      <fa-icon [icon]="item.icon" class="text-lg" [class.mr-4]="!isCollapsed"></fa-icon>
      <span *ngIf="!isCollapsed" class="whitespace-nowrap">{{ item.label }}</span>
    </a>
  </ng-template>

  <div class="mt-auto border-t border-gray-100 bg-gray-50/50">
    <div class="p-2 space-y-1">
      <a [routerLink]="['/home']"
         class="flex items-center py-2 px-4 text-xs text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all"
         [ngClass]="{'justify-center px-0': isCollapsed}">
        <fa-icon [icon]="faHouse" [class.mr-3]="!isCollapsed"></fa-icon>
        <span *ngIf="!isCollapsed">Dashboard</span>
      </a>
      
      <button (click)="handleLogout()"
         class="w-full flex items-center py-2 px-4 text-xs text-red-500 hover:bg-red-50 rounded-lg transition-all"
         [ngClass]="{'justify-center px-0': isCollapsed}">
        <fa-icon [icon]="faSignOutAlt" [class.mr-3]="!isCollapsed"></fa-icon>
        <span *ngIf="!isCollapsed">Logout</span>
      </button>
    </div>
    
    <div *ngIf="!isCollapsed" class="p-4 text-[9px] text-gray-400 font-medium text-center uppercase tracking-widest">
      © 2026 Admin Panel
    </div>
  </div>
</aside>
