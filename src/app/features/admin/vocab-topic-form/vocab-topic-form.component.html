<div class="min-h-screen bg-[#f8fafc] pb-10 font-sans text-slate-800">
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-3 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-3">
      <button (click)="onCancel()" class="p-2 text-slate-400 hover:text-sky-600 hover:bg-sky-50 rounded-lg transition-all">
        <fa-icon [icon]="faTimes" class="text-xs"></fa-icon>
      </button>
      <div>
        <h2 class="text-lg font-extrabold tracking-tight text-slate-800 flex items-center gap-2">
          <div class="w-1 h-5 bg-sky-500 rounded-full"></div>
          {{ initialData ? "Cập nhật chủ đề" : "Tạo chủ đề từ vựng" }}
        </h2>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button
        type="submit"
        (click)="onSubmit()"
        [disabled]="form.invalid"
        class="px-6 py-2 bg-sky-600 text-white font-black rounded-xl shadow-md shadow-sky-100 uppercase text-[10px] tracking-widest hover:bg-sky-700 disabled:opacity-20 transition-all flex items-center gap-2"
      >
        <fa-icon [icon]="faSave"></fa-icon>
        {{ initialData ? "Cập nhật" : "Lưu chủ đề" }}
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-6 md:p-10">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <section class="p-8 bg-white rounded-[2rem] border border-slate-100 shadow-sm relative overflow-hidden">
        <div class="absolute -top-6 -right-6 w-24 h-24 bg-sky-50 rounded-full blur-2xl opacity-60 pointer-events-none"></div>

        <div class="relative space-y-6">
          <div>
            <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 block">Tên chủ đề</label>
            <input
              type="text"
              formControlName="name"
              class="w-full text-2xl font-black bg-transparent border-none focus:ring-0 placeholder:text-slate-100 p-0 text-slate-700"
              placeholder="Nhập tên chủ đề..."
            />
            <div class="h-1 w-12 bg-sky-400 mt-1 rounded-full"></div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
            <div>
              <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Cấp độ mục tiêu</label>
              <div class="relative">
                <select
                  formControlName="level"
                  class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-2.5 text-xs font-bold appearance-none focus:ring-2 focus:ring-sky-500/10 focus:border-sky-200 outline-none text-slate-600 cursor-pointer"
                >
                  <option [value]="Level.BEGINNER">Cơ bản (Beginner)</option>
                  <option [value]="Level.INTERMEDIATE">Trung cấp (Intermediate)</option>
                  <option [value]="Level.ADVANCED">Nâng cao (Advanced)</option>
                </select>
                <fa-icon [icon]="faChevronDown" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 text-[10px] pointer-events-none"></fa-icon>
              </div>
            </div>

            <div>
              <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Mô tả (Không bắt buộc)</label>
              <input
                type="text"
                formControlName="description"
                class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-2.5 text-xs font-medium focus:ring-2 focus:ring-sky-500/10 focus:border-sky-200 outline-none text-slate-600"
                placeholder="Vài dòng giới thiệu về bộ từ vựng..."
              />
            </div>
          </div>
        </div>
      </section>

      <section class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
        <div class="flex flex-col sm:flex-row items-center gap-6">
          <div class="relative w-32 h-32 shrink-0 group/upload cursor-pointer">
            <input type="file" (change)="onFileSelected($event)" class="absolute inset-0 opacity-0 z-10 cursor-pointer" accept="image/*" />
            
            <div *ngIf="imagePreview" class="w-full h-full rounded-2xl overflow-hidden border border-slate-50 shadow-inner">
              <img [src]="imagePreview" class="w-full h-full object-cover" />
              <div class="absolute inset-0 bg-sky-600/20 opacity-0 group-hover/upload:opacity-100 transition-all flex items-center justify-center">
                <fa-icon [icon]="faImage" class="text-white"></fa-icon>
              </div>
            </div>

            <div *ngIf="!imagePreview" class="w-full h-full rounded-2xl border-2 border-dashed border-slate-100 flex flex-col items-center justify-center bg-slate-50/50 group-hover/upload:bg-sky-50 group-hover/upload:border-sky-100 transition-all">
              <fa-icon [icon]="faImage" class="text-slate-200 text-xl mb-1"></fa-icon>
              <span class="text-[8px] font-bold text-slate-400 uppercase">Ảnh đại diện</span>
            </div>
          </div>

          <div class="text-center sm:text-left">
            <h4 class="text-sm font-bold text-slate-700">Hình ảnh chủ đề</h4>
            <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">
              Chọn một hình ảnh đại diện để học viên dễ dàng nhận diện chủ đề này hơn trong danh sách.
            </p>
          </div>
        </div>
      </section>

    </form>
  </main>
</div>
